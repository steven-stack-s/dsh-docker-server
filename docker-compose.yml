# ============================================================================
# DeepSeek Harness (DSH) — 通用 Docker 部署（适用于任意 Linux/Docker 环境）
#
# 【架构】
#   - 镜像 dsh-docker-server（node:24 + git + socat + entrypoint）：构建一次，之后不再重建
#   - DSH 程序本体装在卷 /opt/dsh：日常升级 = 容器内 npm 操作
#   - dsh web 只监听 127.0.0.1:3081（安全设计），socat 把外部 0.0.0.0:3080 转发进去
#   - 默认内网直连；远程访问（账号密码 + MFA）按 docs/02-认证与远程访问.md 可选加装
#
# 【日常维护】
#   升级 DSH：docker exec dsh npm install -g @deepseek-ai/dsh@<新版本> && docker restart dsh
#   装插件：docker exec dsh dsh plugin --profile web add <包名> && docker restart dsh
#   换密钥：改 .env 的 DEEPSEEK_API_KEY 后 docker compose up -d
#
# 【快速开始】
#   1. cp .env.example .env 并填写 DEEPSEEK_API_KEY
#   2. docker compose up -d
#   3. 访问 http://<主机IP>:3080
# ============================================================================

services:
  dsh:
    # 镜像拉取策略：默认 ghcr.io 的 :latest（跟随最近一次 v*-dsh* tag 发布的锁定版本）。
    #   要彻底锁死某个版本，请显式指定 DSH_IMAGE=ghcr.io/steven-stack-s/dsh-docker-server:v<项目版本>-dsh-<dsh版本>
    #   例如 v0.5.4-dsh-0.1.7-rc.2（v* tag 构建时 seed 的 dsh 版本与 tag 后缀严格一致）。
    image: ${DSH_IMAGE:-ghcr.io/steven-stack-s/dsh-docker-server:latest}
    # 【为什么这里刻意没有 build:】
    #   真机教训（2026-09-17）：当 `image:` 与 `build:` 共用同一个 tag 时，只要本地没有该镜像，
    #   `docker compose up -d` 就会回退成「用当前目录的 Dockerfile/scripts 构建」，而不是报错。
    #   于是「把 DSH_IMAGE 换成本次要升级的 tag、但该 tag 在 ghcr 上还没发布」这种情形会
    #   **静默退化**为跑一份"用旧 checkout 构建、名字却像新版本"的镜像 —— 排查时极具误导性
    #   （真机表现：容器内 /usr/local/bin/dsh-entrypoint 仍是上一版，`DSH_INIT_DONE` 不存在，
    #   却以为已经在跑新 tag）。
    #   去掉 build 后，pull 不到就是硬失败，不会再有"看似升级成功、实则跑旧代码"的中间态。
    #   确需自建（离线/内网、换 APT 镜像源、自定义 Node 基础镜像）请显式用 docker build：
    #     docker build --build-arg DSH_VERSION=<版本> --build-arg APT_MIRROR=mirrors.aliyun.com \
    #       -t <你的仓库>/dsh-docker-server:<版本> .
    #   然后把该 tag 填进 .env 的 DSH_IMAGE。（构建参数说明见 Dockerfile 顶部与 docs/07）
    container_name: ${DSH_CONTAINER_NAME:-dsh}
    restart: unless-stopped

    environment:
      # 数据根目录（显式指定，不依赖容器内 HOME）
      - DSH_HOME=/data/dsh
      # 运行用户的 HOME（**非 root 下必须可读写**，且**必须是"默认打开就有内容"的目录**）。
      #
      # ① 为什么要设：镜像刻意不设 HOME，Docker 会给 root 的 /root；而 /root 是 700 root ——
      #    降权到 uid 1000 后连读都不行。真机症状（2026-09-17）：插件市场报「找到 pnpm 但
      #    pnpm --version 失败」，pnpm 原始输出：
      #      Failed to read pnpm-workspace.yaml at /root/.config/pnpm/config.yaml:
      #      Permission denied (os error 13)
      #    实测：HOME=/root → 上述报错；HOME 指向可写目录 → pnpm 12.4.2 正常。
      #    （pnpm 本体是完整的 48MB bundle，不是需要联网的 corepack shim，无需重装。）
      #
      # ② 为什么是 /workspace 而不是 /data/dsh/home：
      #    「新建会话 → 选择工作区」的选择器**默认就列 HOME**，且 UI 默认**不显示隐藏文件**：
      #      const target = resolve(path ?? homedir());   // dsh-host-directory-picker-browse
      #    放在 /data/dsh/home 时里面只有 .config/.local 等隐藏项 → 列表全空 → 用户"选取不到
      #    工作区"（真机 2026-09-17）。而 /workspace 下就是 code/ session/ 两个可见目录，
      #    选择器一打开即可选。HOME 里的 .config/.local/.gitconfig 等仍是隐藏项，不会污染列表。
      #    该选择器没有可配置的起始目录（browse 后端只暴露 maxEntries），故用 HOME 来定默认值。
      #    ⚠ 改这里前请确认目标目录对运行用户可写、且其**非隐藏**子目录正是你想让用户看到的。
      - HOME=/workspace
      # 容器内非 root 运行用户（uid:gid）。默认 1000:1000 = 多数 NAS/宿主首个非 root 用户，
      # 与 bind mount 目录属主最友好。entrypoint 首启会 chown 三个挂载卷到此用户后降权运行。
      # 仅当宿主上卷属主【不是 1000】时才需要在 .env 覆盖；不写即 1000。
      # （无需与镜像构建参数对齐：镜像已不声明 USER_UID/USER_GID build-arg，直接复用自带的
      #   node 用户 1000。旧注释「须与 Dockerfile 构建参数一致」是错的，已删。）
      # ⚠ 该 uid 最好能在容器 /etc/passwd 中查到（1000 即自带的 node 用户）；填一个查不到的
      #   uid 不会导致启动失败，但 entrypoint 会退化为「不带附加组」降权。
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      # Node 堆上限（按宿主机内存调整；须 << MEM_LIMIT，DSH 多进程 RSS 超堆值，堆过大易被容器 OOM-kill）
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_OLD_SPACE:-1024}
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
      # 国内 npm 加速（可选）：首次安装/升级 DSH、装 pnpm 时走国内镜像源
      - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
      # npm/pnpm 下载缓存目录。默认指到可写卷 /opt/dsh/.npm-cache（read_only 根 FS 下，
      # /root/.npm 不可写，会让 docker exec npm install 升级链路 EACCES 失败）。
      # 该目录由 entrypoint 首启创建并 chown 给运行用户；root(docker exec) 与 node(1000) 均可写。
      # rescue clean 会清空其中的 _cacache。留空则 entrypoint 兜底到 /opt/dsh/.npm-cache。
      - NPM_CONFIG_CACHE=${NPM_CONFIG_CACHE:-/opt/dsh/.npm-cache}
      # ★ 模型 API 密钥（DSH 从环境变量读取，不落盘；换 key 改 .env 重建即可）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
      # ★ /api Host 信任白名单（dsh 0.1.2 起仅信任 loopback 或白名单 Host）：
      #   未装认证插件 dsh-remote 时，局域网 IP 或隧道域名访问必须填入，否则页面
      #   能开但连接异常（/api 403）。装了 dsh-remote 则无需填（登录后其 trustProxy
      #   会把已认证请求的 Host 归一为 loopback）。
      #   逗号分隔，可带端口，如 "192.168.1.5:3080,app.xx.ugdocker.link"
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      # 救生舱（lifeboat）开关：RESCUE=1 时 entrypoint 进救生舱（回退到固定 dsh 版本）
      - RESCUE=${RESCUE:-0}
      # 自动干预总闸：off = 只诊断不自动改动插件树（与 RESCUE_SELFHEAL 取与）
      - RESCUE_AUTO=${RESCUE_AUTO:-on}
      - RESCUE_START_TIMEOUT=${RESCUE_START_TIMEOUT:-120}
      - RESCUE_KEEP=${RESCUE_KEEP:-3}
      # 启动重试上限（默认 KEEP+1，可独立配置）与证据目录保留份数（默认跟随 KEEP）
      - RESCUE_MAX_ATTEMPTS=${RESCUE_MAX_ATTEMPTS:-4}
      - RESCUE_EVIDENCE_KEEP=${RESCUE_EVIDENCE_KEEP:-3}
      - RESCUE_PROFILE=${RESCUE_PROFILE:-web}
      # 自动排查·根因归因·智能自愈（红线：仅动插件树四件套，绝不动 cordis.patch.yml/会话/记忆/配置/凭据）
      - RESCUE_SELFHEAL=${RESCUE_SELFHEAL:-on}
      - RESCUE_REMOVE_LIMIT=${RESCUE_REMOVE_LIMIT:-2}
      - RESCUE_ROLLBACK_LIMIT=${RESCUE_ROLLBACK_LIMIT:-2}
      - RESCUE_DIAGNOSE_EVIDENCE=${RESCUE_DIAGNOSE_EVIDENCE:-on}
      - RESCUE_EVIDENCE_MAX=${RESCUE_EVIDENCE_MAX:-20971520}
      - RESCUE_INCIDENT_KEEP=${RESCUE_INCIDENT_KEEP:-20}
      # 健康后自动拍基线快照（off=关）；此前未透传，compose 部署下无法关闭
      - RESCUE_SNAPSHOT_ON_HEALTHY=${RESCUE_SNAPSHOT_ON_HEALTHY:-on}
      # 快照模式：hardlink=cp -al（省空间，但与 live 共享 inode）；copy=cp -a（独立不可变副本）
      - RESCUE_SNAPSHOT_MODE=${RESCUE_SNAPSHOT_MODE:-hardlink}
      # 自愈预算的滑动窗口（秒）：窗口过期自动清零，避免预算永久耗尽后自愈静默失效
      - RESCUE_SELFHEAL_WINDOW=${RESCUE_SELFHEAL_WINDOW:-86400}
      # 自愈彻底失败后自动进救生舱（off=只退出，交给 restart 策略）
      - RESCUE_AUTO_LIFEBOAT=${RESCUE_AUTO_LIFEBOAT:-on}
      # socat 并发上限：fork 模式每连接一个进程，无上限时外部并发连接可耗尽容器内存
      - SOCAT_MAX_CHILDREN=${SOCAT_MAX_CHILDREN:-64}
      # 凭据文件（docker secret / 挂载文件）：优先于 DEEPSEEK_API_KEY 环境变量
      - DEEPSEEK_API_KEY_FILE=${DEEPSEEK_API_KEY_FILE:-}
      # 临时文件根目录：从 tmpfs /tmp（硬上限 128m）迁到数据卷，消除"临时任务写满 /tmp"。
      # dsh 的 spill / subprocess spool / workspace-changes 都走 os.tmpdir()，随之迁移；
      # 回收由 `docker exec dsh rescue clean` 负责（dsh 自身的清理时机不可靠）。
      # 改动前请先清掉 /tmp 下遗留的 dsh-* 目录 —— 迁移后它们不再被任何人扫描。
      - TMPDIR=${TMPDIR:-/data/dsh/tmp}
      # `rescue clean` 回收 TMPDIR 下 dsh 临时产物时保留多少分钟内的（默认 1440=24h）。
      # 阈值内的目录视为"可能仍在使用"，绝不删；调小更激进（如 60），调大更保守。
      - RESCUE_TMP_KEEP_MIN=${RESCUE_TMP_KEEP_MIN:-1440}

    volumes:
      # DSH 程序本体（npm 全局包 + dsh/pnpm 命令）——升级与插件管理写入这里
      - ${PROGRAMS_DIR:-./programs}:/opt/dsh
      # DSH 用户数据（会话/配置/插件/凭据/Hindsight 记忆库）——必须持久化
      - ${DSH_DATA_DIR:-./dsh}:/data/dsh
      # agent 工作区
      - ${WORKSPACE_DIR:-./workspace}:/workspace

    ports:
      # 外部访问 3080；容器内 socat 转发到 dsh 内部 127.0.0.1:3081
      - "${DSH_PORT:-3080}:3080"

    # 资源限制（按宿主机配置调整；N100 + 8GB 示例给系统留余量）
    mem_limit: ${MEM_LIMIT:-2g}
    cpus: ${CPU_LIMIT:-2}
    # 进程数上限：socat 每连接 fork 一个进程，无上限时并发连接可拖垮容器
    pids_limit: ${PIDS_LIMIT:-512}

    # 容器硬化（安全加固升级）：
    #   - no-new-privileges：禁止进程通过 setuid/setgid 提权（低层面保险）
    #   - read_only:true：根文件系统只读 —— dsh/agent/第三方插件无法在镜像层落盘或篡改
    #   - cap_drop:[ALL] + 最小 cap_add 白名单：容器进程几乎无 root capability
    #   - tmpfs /tmp：read_only 后唯一需要写盘的系统目录（mktemp/npm 构建临时等）
    #     ⚠ 必须带 exec（见下方 tmpfs 行的说明）：Docker 的 tmpfs 默认 noexec
    # --------------------------------------------
    # 【为何保留 4 个 cap】非 root 运行链路需要：
    #   CHOWN / DAC_OVERRIDE  → entrypoint 首启把挂载卷 chown 给运行用户 node(1000)
    #   SETUID / SETGID       → setpriv 降权（root→1000）时设置 uid/gid
    # 这些能力只有首启那几毫秒用得到；运行期 dsh/agent 进程（已是 uid 1000）不具备它们。
    # --------------------------------------------
    # 【NAS / 内核组合注意】`cap_drop:[ALL]` 搭配部分 NAS 内核（尤其 bind mount 到
    # NFS/eCryptfs/某些存储池）时，可能影响卷内文件权限/硬链接（rescue 快照 hardlink
    # 模式用 cp -al）。已在本仓库 e2e 沙箱验证通过；部署到目标 NAS 前请先跑一次
    # `scripts/t/e2e-container-selftest.sh` 确认卷权限与 rescue 链路正常。
    read_only: true
    tmpfs:
      # ⚠ 必须显式带 exec：Docker 的 tmpfs 默认挂载选项含 noexec，而 dsh 的 **profile 插件解析**
      # 依赖原生插件 node-addon-native-custom-loader —— 它会把 node-addon-require-builtin 的
      # .node 绑定复制到 $TMPDIR/node-addon-native-custom-loader-<uid>/native-cache/ 再 require()。
      # 在 noexec 的 /tmp 上该 require 会以
      #   "failed to map segment from shared object"
      # 失败 → 绑定不可用 → dsh-app-boot 装不上 profile 解析 hook（loader.internal 为空）→
      # 所有第三方插件 ERR_MODULE_NOT_FOUND → web profile 启动失败 → 自愈耗尽 → 进 lifeboat。
      # （真机教训 2026-09-17：空 profile 不触发，只有装了插件的部署才会踩到。）
      - /tmp:size=128m,exec
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # 与 rescue 同判据（都连 127.0.0.1:3081）；此 healthcheck 覆盖 Dockerfile 内的值。
      # start_period 是 docker 的放弃时限（容首启复制 seed + 冷启动）；
      # rescue 探测窗口 RESCUE_START_TIMEOUT(默认 120s) 必须小于它，否则 rescue 会先于 docker
      # 放弃而误回滚仍在冷启动的 dsh。调大 RESCUE_START_TIMEOUT 时请同步调大此 start_period。
      test: ["CMD", "node", "-e", "require('net').connect(3081,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 300s   # 容首启复制 seed + dsh 冷启动（须 > RESCUE_START_TIMEOUT）
      retries: 5
