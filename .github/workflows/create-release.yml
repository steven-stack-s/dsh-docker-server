# ============================================================================
# create-release.yml — 为【已存在的】tag 创建或更新 GitHub Release
#
# 为什么单独一个 workflow：正式发布的 Release 由 docker-image.yml 在 tag 构建成功后自动创建；
# 但当 tag 已经推过、或需要给历史 tag 补 Release 时，重新跑一次多架构构建既慢又没必要。
# 这里通过 workflow_dispatch 触发，使用内置的 GITHUB_TOKEN，**不需要额外的 PAT**。
#
# 用法（Actions → create-release → Run workflow）：
#   - tag 留空  → 自动补齐所有**尚无 Release** 的 tag（历史版本一次性补齐）
#   - tag 填值  → 只处理该 tag（如 v0.4.0-dsh-0.1.5-rc.1），幂等：已存在则更新正文
#
# release notes 取自 CHANGELOG 中对应 tag 的段落；抽不到时退回一句指向 CHANGELOG 的说明。
# ============================================================================
name: create-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要处理的 tag（留空则补齐所有尚无 Release 的 tag）'
        required: false
        default: ''
  # 本文件自身被修改并推送时也跑一次（幂等）：新建或调整补建逻辑后不必再手动点一次。
  push:
    paths:
      - '.github/workflows/create-release.yml'

# 防重入：补建/更新 Release 的脚本是状态一致的 —— 两个并发 run 会对同一批 tag 做 create/edit，
# 谁会先写、谁覆盖谁无法确定。串行化（排队而非取消）保证一次只处理一批，避免互相踩踏。
# cancel-in-progress: false = 排队而非取消，避免中途打断正在写的 Release。
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout（含全部 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 必须显式 fetch-tags：actions/checkout 在 workflow_dispatch（基于分支）触发时
          # 只 fetch 被检出的 ref，fetch-depth:0 保证的是"全历史"而**不是"全 tag"**。
          # 实测：只 fetch main 时本地 tag 数为 0，于是 candidates="$(git tag -l)" 为空、
          # 循环空转 —— 表现为"工作流绿灯、release 却一个都没建"，极难察觉。
          fetch-tags: true

      - name: Create or update release(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -u
          fail=0
          if [ -n "${TARGET_TAG:-}" ]; then
            candidates="$TARGET_TAG"
          else
            candidates="$(git tag -l --sort=v:refname)"
          fi
          # 空候选必须【报错】而不是静默成功：本工作流曾因 checkout 没拉 tag 导致
          # candidates 为空、循环空转、工作流绿灯却什么都没建（10 秒跑完）。
          if [ -z "$(printf "%s" "$candidates" | tr -d "[:space:]")" ]; then
            echo "::error::候选 tag 为空 —— 多半是 checkout 没拉到 tag（见 fetch-tags）。拒绝静默成功。"
            exit 1
          fi
          created=0; updated=0
          for t in $candidates; do
            [ -n "$t" ] || continue
            if ! git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::warning::tag $t 不存在，跳过"
              continue
            fi
            awk -v tag="$t" '
              index($0, "## [" tag "]") == 1 { f = 1; next }
              f && index($0, "## [") == 1 { exit }
              f { print }
            ' CHANGELOG.md > /tmp/notes.md
            if [ ! -s /tmp/notes.md ]; then
              printf 'See CHANGELOG.md for details.\n' > /tmp/notes.md
            fi
            # 每个 tag 的成败都要单独判定并计入 fail —— 旧实现只判断 create/edit 的"有没有执行"，
            # 不看退出码，于是单个 release 创建失败会被完全吞掉，工作流照样绿灯（v0.4.3 就是这么丢的）。
            if gh release view "$t" >/dev/null 2>&1; then
              # --draft=false：把 draft Release 一并发布出去。
              # 场景：tag 被删除后重新推送时，GitHub 会把原 Release 转为 **draft**，
              # 而 gh release edit 默认【不改变 draft 状态】—— 于是这里"更新成功"、workflow 绿灯，
              # 但用户在 Releases 页面永远看不到它（匿名 /releases/tags/<tag> 返回 404）。
              # v0.4.9 实测踩到：删 tag 重推后 Release 卡在 draft，绿灯却不可见。
              if gh release edit "$t" --title "$t" --notes-file /tmp/notes.md --draft=false; then
                echo "updated: $t"; updated=$((updated + 1))
              else
                echo "::error::更新 release 失败: $t"; fail=1
              fi
            else
              if gh release create "$t" --title "$t" --notes-file /tmp/notes.md --verify-tag; then
                echo "created: $t"; created=$((created + 1))
              else
                echo "::error::创建 release 失败: $t"; fail=1
              fi
            fi
          done
          echo "==== 完成：新建 $created 个，更新 $updated 个 ===="
          echo "查看：https://github.com/steven-stack-s/dsh-docker-server/releases"
          # 有任一失败即让 job 变红，杜绝"绿灯假成功"
          [ "$fail" -eq 0 ] || { echo "::error::有 release 未能创建/更新，见上方 error"; exit 1; }
